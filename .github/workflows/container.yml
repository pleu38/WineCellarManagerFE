name: Compiler et publier Maison des Vins (GHCR)

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - ci/build-ghcr-container
      - feat/mobile-responsive-home-theme
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Tester, compiler et construire le conteneur
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter les tests
        run: npm test

      - name: Compiler le frontend
        run: npm run build

      - name: Vérifier le contenu réel de la compilation
        run: |
          grep -R -q "hero-theme-toggle" dist/assets
          grep -R -q "page-ajout" dist/assets
          grep -R -q "page-cave" dist/assets

      - name: Activer QEMU pour les architectures ARM
        uses: docker/setup-qemu-action@v3

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR (sauf sur les PR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer les étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pleu38/winecellarmanagerfe
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/build-ghcr-container' || github.ref == 'refs/heads/feat/mobile-responsive-home-theme' }}
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          no-cache: ${{ github.ref == 'refs/heads/main' }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vérifier latest publiée sur GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          image="ghcr.io/pleu38/winecellarmanagerfe:latest"
          docker pull --platform linux/amd64 "$image"
          revision="$(docker run --rm --platform linux/amd64 --entrypoint cat "$image" /usr/share/nginx/html/build-info.json)"
          echo "Version réellement publiée : $revision"
          expected="$(printf '{"revision":"%s"}' "$GITHUB_SHA")"
          if [ "$revision" != "$expected" ]; then
            echo "::error::L'image latest n'a pas le commit attendu ($GITHUB_SHA)"
            exit 1
          fi
          docker run --rm --platform linux/amd64 --entrypoint sh "$image" -c '
            grep -R -q "hero-theme-toggle" /usr/share/nginx/html/assets &&
            grep -R -q "page-ajout" /usr/share/nginx/html/assets &&
            grep -R -q "page-cave" /usr/share/nginx/html/assets
          '
          echo "latest correspond au code du commit $GITHUB_SHA et contient les nouveaux écrans."
