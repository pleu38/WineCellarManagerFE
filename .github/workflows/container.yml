name: Compiler et publier Vinothèque (GHCR)

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - ci/build-ghcr-container
      - feat/mobile-responsive-home-theme
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Tester, compiler et construire le conteneur
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter les tests
        run: npm test

      - name: Compiler le frontend
        run: npm run build

      - name: Activer QEMU pour les architectures ARM
        uses: docker/setup-qemu-action@v3

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR (sauf sur les PR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer les étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pleu38/winecellarmanagerfe
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/ci/build-ghcr-container' || github.ref == 'refs/heads/feat/mobile-responsive-home-theme' }}
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
